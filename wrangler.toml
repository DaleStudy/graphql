name = "graphql"
account_id = "86aa227176a624680f7d34e691472576"
main = "src/index.ts"
compatibility_date = "2026-03-01"

[[containers]]
class_name = "RouterContainer"
image = "./Dockerfile"
instance_type = "basic"
max_instances = 3

[[durable_objects.bindings]]
name = "ROUTER"
class_name = "RouterContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RouterContainer"]

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
