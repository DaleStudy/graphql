supergraph:
  listen: 0.0.0.0:8080
  introspection: true
health_check:
  listen: 0.0.0.0:8088
  enabled: true
  path: /health
include_subgraph_errors:
  all: true
cors:
  allow_any_origin: true
connectors:
  sources:
    github.github:
      $config:
        token: ${env.GITHUB_API_TOKEN}
telemetry:
  instrumentation:
    spans:
      mode: spec_compliant
sandbox:
  enabled: true
homepage:
  enabled: false
